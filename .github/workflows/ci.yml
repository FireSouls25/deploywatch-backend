name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Acciones fijadas por SHA completo (versión en el comentario) para evitar
# ataques a la cadena de suministro por etiquetas mutables.
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Sonar necesita el historial para el "código nuevo"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install --only-binary ":all:" --require-hashes -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests load scripts infra

      - name: Pruebas + quality gate de cobertura (80 %)
        run: |
          coverage run -m pytest -q --junitxml=test-results.xml
          coverage xml
          coverage html
          coverage report --fail-under=80

      - name: Reporte HTML de cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: ignore

      # Se ejecuta en el mismo job para reutilizar coverage.xml.
      - name: SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0

  docker:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t deploywatch-backend:${{ github.sha }} .

  # Prueba de carga: la API real sobre Postgres, con un quality gate de
  # latencia (p95) y tasa de error definido en load/locustfile.py.
  load:
    runs-on: ubuntu-latest
    needs: [test]
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deploywatch
          POSTGRES_DB: deploywatch
          # BD efímera del runner, solo accesible en localhost durante el job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deploywatch"
          --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://deploywatch@localhost:5432/deploywatch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-load.txt

      - run: |
          pip install --only-binary ":all:" --require-hashes -r requirements.txt
          python -m venv .venv-load
          .venv-load/bin/pip install --only-binary ":all:" --require-hashes -r requirements-load.txt

      - name: Levantar la API
        run: |
          nohup uvicorn app.main:app --port 8000 > api.log 2>&1 &
          for _ in $(seq 1 30); do curl -fs localhost:8000/api/health && exit 0; sleep 1; done
          cat api.log; exit 1

      - name: Locust (30 usuarios, 45 s) + quality gate
        run: |
          .venv-load/bin/locust -f load/locustfile.py --headless \
            -u 30 -r 10 -t 45s --host http://localhost:8000 \
            --only-summary --html locust-report.html

      - name: Reporte HTML de carga
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: locust-report
          path: locust-report.html
          if-no-files-found: ignore
