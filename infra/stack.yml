# Infraestructura como código (CloudFormation) de los eventos de despliegue.
# Se aplica contra LocalStack en local y en el CD; el mismo template serviría
# para una cuenta real de AWS.
AWSTemplateFormatVersion: "2010-09-09"
Description: DeployWatch - cola de eventos y bucket de reportes de despliegue

Parameters:
  Entorno:
    Type: String
    Default: staging
    AllowedValues: [staging, production]

Resources:
  # Mensajes que no se pudieron procesar tras 3 intentos.
  DeployEventsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub deploywatch-${Entorno}-deploy-events-dlq
      MessageRetentionPeriod: 1209600 # 14 días

  # Un mensaje por despliegue: desplegado, rollback o fallido.
  DeployEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub deploywatch-${Entorno}-deploy-events
      VisibilityTimeout: 30
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeployEventsDLQ.Arn
        maxReceiveCount: 3

  # Destino de los logs de acceso del bucket de reportes. LogDeliveryWrite
  # permite que el servicio de logs de S3 escriba en él (y en ningún otro).
  AccessLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub deploywatch-${Entorno}-access-logs
      AccessControl: LogDeliveryWrite
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Reporte JSON de cada despliegue: versionado, cifrado, privado y auditado.
  DeployReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub deploywatch-${Entorno}-deploy-reports
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucket
        LogFilePrefix: deploy-reports/
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Rechaza cualquier acceso sin TLS a los buckets.
  AccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AccessLogsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SoloHttps
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt AccessLogsBucket.Arn
              - !Sub "${AccessLogsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  DeployReportsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DeployReportsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SoloHttps
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DeployReportsBucket.Arn
              - !Sub "${DeployReportsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

Outputs:
  QueueUrl:
    Value: !Ref DeployEventsQueue
  BucketName:
    Value: !Ref DeployReportsBucket
