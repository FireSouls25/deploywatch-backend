services:
  db:
    image: postgres:16-alpine
    # Credenciales fuera del código: se leen de .env (ver .env.example).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deploywatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-deploywatch}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-deploywatch}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-deploywatch}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  # Emulador de AWS para la infraestructura de infra/stack.yml.
  # Solo arranca con: docker compose --profile infra up -d localstack
  # Versión 4.14 fijada: las posteriores exigen LOCALSTACK_AUTH_TOKEN.
  localstack:
    profiles: [infra]
    image: localstack/localstack:4.14@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    environment:
      SERVICES: cloudformation,sqs,s3
    ports: ["127.0.0.1:4566:4566"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:4566/_localstack/health"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
