services:
  db:
    image: postgres:16-alpine
    # Credenciales fuera del código: se leen de .env (ver .env.example).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deploywatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-deploywatch}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-deploywatch}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-deploywatch}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
